services:
  scraper:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/vacantes.db
    volumes:
      - vacantes-data:/app/data
    command: ["supercronic", "-passthrough-logs", "/app/crontab"]
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 1gb

  # One-off run: docker compose --profile once run --rm scraper-once
  scraper-once:
    profiles: ["once"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/vacantes.db
    volumes:
      - vacantes-data:/app/data
    command: ["node", "src/monitor.js"]
    shm_size: 1gb

volumes:
  vacantes-data:
