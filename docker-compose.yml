services:
  # Contenedor permanente: supercronic ejecuta la consulta cada hora.
  scraper:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/vacantes.db
    volumes:
      - vacantes-data:/app/data
    command: ["supercronic", "-passthrough-logs", "/app/crontab"]
    restart: unless-stopped
    init: true
    mem_limit: 1g
    shm_size: 1gb

  # Consulta única: docker compose --profile once run --rm scraper-once
  scraper-once:
    profiles: ["once"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/vacantes.db
    volumes:
      - vacantes-data:/app/data
    command: ["node", "src/monitor.js"]
    shm_size: 1gb

volumes:
  vacantes-data:
