name: Vacantes de Profesores - MEP

on:
  schedule:
    # Cada hora. GitHub deshabilita los cron de repos públicos tras 60 días sin
    # commits; cualquier push vuelve a activarlos.
    - cron: "0 * * * *"
  workflow_dispatch:

# Evita que dos consultas simultáneas se pisen y corrompan el estado guardado.
concurrency:
  group: vacantes-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # Sólo se usa cuando no hay DATABASE_URL. La caché de Actions se borra a
      # los 7 días sin uso; para un histórico permanente configure Turso.
      - name: Restore vacancy state
        if: env.DATABASE_URL == ''
        uses: actions/cache@v4
        with:
          path: data/baseline.json
          key: vacancy-baseline-${{ github.run_id }}
          restore-keys: |
            vacancy-baseline-

      - name: Run monitor
        env:
          TARGET_URL: ${{ vars.TARGET_URL }}
          CONTENT_SELECTOR: ${{ vars.CONTENT_SELECTOR }}
          USE_PLAYWRIGHT: ${{ vars.USE_PLAYWRIGHT }}
          HEADLESS: ${{ vars.HEADLESS }}
          DROPDOWN_SELECTOR: ${{ vars.DROPDOWN_SELECTOR }}
          DROPDOWN_OPTION_VALUE: ${{ vars.DROPDOWN_OPTION_VALUE }}
          DROPDOWN_OPTION_LABEL: ${{ vars.DROPDOWN_OPTION_LABEL }}
          DROPDOWN_WAIT_AFTER_MS: ${{ vars.DROPDOWN_WAIT_AFTER_MS }}
          DROPDOWN_CUSTOM: ${{ vars.DROPDOWN_CUSTOM }}
          DROPDOWN_OPTION_SELECTOR: ${{ vars.DROPDOWN_OPTION_SELECTOR }}
          MAX_PAGES: ${{ vars.MAX_PAGES }}
          TABLE_CELL_NAMES: ${{ vars.TABLE_CELL_NAMES }}
          TABLE_IDENTITY_CELL_NAMES: ${{ vars.TABLE_IDENTITY_CELL_NAMES }}
          TABLE_FILTER_ESPECIALIDAD: ${{ vars.TABLE_FILTER_ESPECIALIDAD }}
          TABLE_FILTER_ESPECIALIDAD_VALUE: ${{ vars.TABLE_FILTER_ESPECIALIDAD_VALUE }}
          TABLE_FILTER_PUESTO: ${{ vars.TABLE_FILTER_PUESTO }}
          TABLE_FILTER_PUESTO_VALUE: ${{ vars.TABLE_FILTER_PUESTO_VALUE }}
          TABLE_FILTER_INSTITUCION: ${{ vars.TABLE_FILTER_INSTITUCION }}
          TABLE_FILTER_INSTITUCION_VALUE: ${{ vars.TABLE_FILTER_INSTITUCION_VALUE }}
          TABLE_FILTER_LECCIONES: ${{ vars.TABLE_FILTER_LECCIONES }}
          TABLE_FILTER_LECCIONES_VALUE: ${{ vars.TABLE_FILTER_LECCIONES_VALUE }}
          ALLOW_EMPTY_TABLE: ${{ vars.ALLOW_EMPTY_TABLE }}
          BASELINE_PATH: data/baseline.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run monitor
