# Máquina programada en Fly.io (Chromium + volumen SQLite).
#
#   fly launch --no-deploy --copy-config
#   fly volumes create vacantes_data --size 1
#   fly secrets set NTFY_TOPIC=... TARGET_URL=...
#   fly deploy
#   fly machine update <id> --schedule hourly
#
# Con Turso no hace falta el volumen: configure DATABASE_URL y
# DATABASE_AUTH_TOKEN como secrets y borre la sección [[mounts]].

app = "vacantes-mep"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "file:/app/data/vacantes.db"
  USE_PLAYWRIGHT = "1"
  HEADLESS = "1"
  PLAYWRIGHT_LAUNCH_ARGS = "--disable-dev-shm-usage,--no-sandbox"

[[mounts]]
  source = "vacantes_data"
  destination = "/app/data"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
