name: Vacantes de Profesores - MEP

on:
  schedule:
    # Hourly. Public-repo scheduled workflows are disabled after 60 days
    # without commits; a push (including this repo's updates) re-enables them.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Restore vacancy baseline
        uses: actions/cache@v4
        with:
          path: data/baseline.json
          key: vacancy-baseline-${{ github.run_id }}
          restore-keys: |
            vacancy-baseline-

      - name: Run monitor
        env:
          TARGET_URL: ${{ vars.TARGET_URL }}
          CONTENT_SELECTOR: ${{ vars.CONTENT_SELECTOR }}
          USE_PLAYWRIGHT: ${{ vars.USE_PLAYWRIGHT }}
          DROPDOWN_SELECTOR: ${{ vars.DROPDOWN_SELECTOR }}
          DROPDOWN_OPTION_VALUE: ${{ vars.DROPDOWN_OPTION_VALUE }}
          DROPDOWN_OPTION_LABEL: ${{ vars.DROPDOWN_OPTION_LABEL }}
          DROPDOWN_WAIT_AFTER_MS: ${{ vars.DROPDOWN_WAIT_AFTER_MS }}
          DROPDOWN_CUSTOM: ${{ vars.DROPDOWN_CUSTOM || '1' }}
          DROPDOWN_OPTION_SELECTOR: ${{ vars.DROPDOWN_OPTION_SELECTOR }}
          TABLE_FILTER_ESPECIALIDAD: ${{ vars.TABLE_FILTER_ESPECIALIDAD }}
          TABLE_FILTER_ESPECIALIDAD_VALUE: ${{ vars.TABLE_FILTER_ESPECIALIDAD_VALUE }}
          TABLE_CELL_NAMES: ${{ vars.TABLE_CELL_NAMES }}
          BASELINE_PATH: data/baseline.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run monitor
