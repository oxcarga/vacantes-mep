name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/gomep-vacantes

      - name: Typecheck schema
        run: npm run typecheck:schema

      - name: App unit tests
        run: npm test -w gomep-vacantes

      # Las pruebas del scraper usan un servidor HTTP local con fixtures, sin Chromium.
      # El emulador de Firestore cubre el store de producción y las reglas.
      - name: Run scraper and rules tests
        run: npm run test:firestore

      - name: Playwright
        run: npm run test:e2e
